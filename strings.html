</head>
<body>
    <div class="container">
<p>This is string method</p>
    </div>
    <script>
        let first_name="Jane"
        let last_name="Doe"
        let full_name=first_name+""+last_name
        let full_name2=first_name.concat(last_name)
        console.log(full_name)

        console.log(`My name is ${first_name} ${last_name}`)
