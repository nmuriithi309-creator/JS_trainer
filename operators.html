<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <p>JS Operators</p>

    </div> 

    <script>
         let x = 5
        let y = 10
        let z = x + y 
        console.log(z) //15

        let a = 5
        a += 10
        console.log(a)//15

        let value1 = "10"
        let value2 = 5
        let sum = value1 + value2
        let prod = value1 * value2
        let div = value1 / value2
        console.log(sum) //105
        console.log(prod)//50
        console.log(div) //2


        let val = "123"
        let num = Number(val)
        console.log(typeof(num))

        let num2 = 89
        let str = String(num2)
        console.log(typeof(str))

        console.log("5" == 5) //true 
        console.log("5" === 5) //false
    

    </script>
</body>
</html>
